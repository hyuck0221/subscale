name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: sh -n scripts/install.sh scripts/install-source.sh scripts/release.sh
      - run: python3 scripts/test_installer.py
      - run: python3 -m unittest discover -s scripts -p 'test_update_tap.py'
      - run: go test -race -timeout 2m ./...
      - run: make build
      - run: python3 scripts/smoke_test.py
