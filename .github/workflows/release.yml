name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: sh -n scripts/install.sh scripts/install-source.sh scripts/release.sh
      - run: python3 scripts/test_installer.py
      - run: go test -race -timeout 2m ./...
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/release.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "subscale $RELEASE_TAG" --generate-notes
